services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Overrides .env so the container always talks to the "mongo" service
      # and listens on the port actually EXPOSEd/published below.
      MONGODB_URI: mongodb://mongo:27017/kiraapDB
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ../public/uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
